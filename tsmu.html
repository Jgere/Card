<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0A2540" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Giorgi Jgerenaia" />
  <title>Giorgi Jgerenaia, PhD — TSMU</title>
  <style>
    :root {
      --navy: #0A2540;
      --navy-light: #133456;
      --blue: #0E4E8C;
      --accent: #1E90FF;
      --sky: #E8F1FB;
      --text: #1A2A3A;
      --muted: #5A7A9A;
      --white: #FFFFFF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans Georgian", sans-serif;
      background: var(--navy);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text);
    }

    .top-bar {
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, var(--blue), var(--accent), var(--blue));
    }

    .container {
      width: 100%;
      max-width: 420px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .hero {
      background: linear-gradient(180deg, var(--navy) 0%, var(--navy-light) 100%);
      padding: 16px 22px 36px;
      text-align: center;
      position: relative;
    }

    .hero::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 26px;
      background: var(--sky);
      border-radius: 26px 26px 0 0;
    }

    .lang-row {
      display: flex;
      justify-content: flex-end;
      position: relative;
      z-index: 3;
      margin-bottom: 8px;
    }

    .lang-toggle {
      display: flex;
      background: rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 3px;
      border: 1px solid rgba(255,255,255,0.18);
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: #A8C5E2;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 6px 10px;
      border-radius: 999px;
      cursor: pointer;
    }

    .lang-btn.active {
      background: var(--white);
      color: var(--navy);
    }

    

    

    

    

    

    .qr-wrap img {
      width: 72px;
      height: 72px;
      display: block;
      border-radius: 4px;
    }

    .qr-caption {
      margin-top: 6px;
      font-size: 0.62rem;
      font-weight: 600;
      color: #A8C5E2;
      position: relative;
      z-index: 2;
    }

    .content {
      background: var(--sky);
      flex: 1;
      padding: 6px 18px 28px;
    }

    .org-card {
      background: var(--white);
      border-radius: 16px;
      padding: 14px 16px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(10, 37, 64, 0.06);
      margin-bottom: 14px;
    }

    .org-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 5px;
    }

    .org-name {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--blue);
      line-height: 1.4;
    }

    .contacts {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .contact-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--white);
      border-radius: 16px;
      padding: 13px 15px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 4px 14px rgba(10, 37, 64, 0.05);
    }

    .contact-card:active {
      transform: scale(0.98);
    }

    .contact-icon {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--navy), var(--blue));
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .contact-icon svg {
      width: 19px;
      height: 19px;
      fill: white;
    }

    .contact-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .contact-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .contact-value {
      font-size: 1.0rem;
      font-weight: 650;
      color: var(--navy);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px;
      border-radius: 16px;
      font-size: 1.02rem;
      font-weight: 650;
      border: none;
      cursor: pointer;
      text-decoration: none;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%);
      color: white;
      box-shadow: 0 10px 24px rgba(10, 37, 64, 0.28);
    }

    .btn-outline {
      background: var(--white);
      color: var(--navy);
      border: 1.5px solid #C5D8EC;
    }

    .footer {
      text-align: center;
      font-size: 0.76rem;
      color: var(--muted);
    }

    @media (min-width: 480px) {
      body {
        justify-content: center;
        padding: 24px;
        background: linear-gradient(160deg, #071a2e 0%, var(--navy) 40%, var(--blue) 100%);
      }
      .container {
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 30px 60px rgba(0,0,0,0.4);
      }
    }

    .qr-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.12);
      color: #E8F1FB;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-left: 8px;
      padding: 0;
    }
    .qr-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
    .qr-btn:active {
      transform: scale(0.95);
      background: rgba(255,255,255,0.2);
    }

    .lang-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      position: relative;
      z-index: 3;
      margin-bottom: 8px;
    }

    

    

    

    /* QR Modal */
    .qr-modal {
      position: fixed;
      inset: 0;
      background: rgba(10, 37, 64, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 24px;
      backdrop-filter: blur(4px);
    }
    .qr-modal.open {
      display: flex;
    }
    .qr-modal-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 22px 22px 18px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
      max-width: 300px;
      width: 100%;
    }
    .qr-modal-card img {
      width: 220px;
      height: 220px;
      display: block;
      margin: 0 auto 12px;
      border-radius: 8px;
    }
    .qr-modal-title {
      font-size: 0.85rem;
      font-weight: 650;
      color: var(--navy);
      margin-bottom: 4px;
    }
    .qr-modal-sub {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .qr-modal-close {
      border: none;
      background: var(--sky);
      color: var(--navy);
      font-weight: 650;
      font-size: 0.88rem;
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
    }
    .qr-modal-close:active {
      transform: scale(0.98);
    }


    .identity {
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      position: relative;
      z-index: 2;
      margin-top: 6px;
    }

    .coa-wrap {
      background: var(--white);
      padding: 7px;
      border-radius: 14px;
      box-shadow: 0 10px 22px rgba(0,0,0,0.22);
      flex-shrink: 0;
    }

    .coa {
      width: 68px;
      height: auto;
      display: block;
      border-radius: 6px;
    }

    .identity-text {
      min-width: 0;
      flex: 1;
    }

    .name {
      color: var(--white);
      font-size: 1.42rem;
      font-weight: 750;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .title {
      color: #A8C5E2;
      font-size: 0.82rem;
      font-weight: 500;
      line-height: 1.35;
      margin-bottom: 0;
    }

  </style>
</head>
