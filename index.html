<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#E8F1FB" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Giorgi Jgerenaia — Choose card</title>
  <style>
    :root {
      --navy: #0A2540;
      --blue: #0E4E8C;
      --accent: #1E90FF;
      --sky: #E8F1FB;
      --muted: #46617C;
      --line: #D3E2F1;
      --white: #FFFFFF;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans Georgian", sans-serif;
      background: linear-gradient(160deg, #F6FAFE 0%, var(--sky) 55%, #D3E4F5 100%);
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      padding: clamp(24px, 7vh, 64px) 18px 32px; color: var(--navy);
    }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .wrap { width: 100%; max-width: 420px; }
    .top-row { display: flex; justify-content: flex-end; margin-bottom: 18px; }
    .lang-toggle { display: flex; background: var(--white); border-radius: 999px; padding: 3px; border: 1px solid var(--line); }
    .lang-btn {
      border: none; background: transparent; color: var(--muted); font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.04em; padding: 6px 10px; border-radius: 999px; cursor: pointer;
    }
    .lang-btn.active { background: var(--navy); color: var(--white); }
    .header { text-align: center; margin-bottom: 28px; }
    .header h1 { font-size: 1.35rem; font-weight: 750; letter-spacing: -0.02em; margin-bottom: 6px; color: var(--navy); }
    .header p { font-size: 0.85rem; color: var(--muted); line-height: 1.4; }
    .cards { display: flex; flex-direction: column; gap: 14px; }
    .card-link {
      display: flex; align-items: center; gap: 16px; background: var(--white); border: 1px solid var(--line);
      border-radius: 18px; padding: 16px; text-decoration: none; color: var(--navy);
      box-shadow: 0 8px 24px rgba(10, 37, 64, 0.08); transition: transform 0.15s ease;
    }
    .card-link:active { transform: scale(0.98); }
    .logo-box {
      width: 72px; height: 72px; border-radius: 14px; background: #fff; border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; padding: 6px;
    }
    .logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .meta { flex: 1; min-width: 0; }
    .meta .label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 3px; }
    .meta .title { font-size: 0.95rem; font-weight: 700; line-height: 1.25; margin-bottom: 3px; }
    .meta .sub { font-size: 0.75rem; color: var(--blue); line-height: 1.3; }
    .arrow { color: var(--muted); font-size: 1.4rem; flex-shrink: 0; }
    .note { margin-top: 22px; text-align: center; font-size: 0.72rem; color: var(--muted); line-height: 1.4; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-row">
      <div class="lang-toggle">
        <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
        <button class="lang-btn" id="btn-ka" onclick="setLang('ka')">ქარ</button>
      </div>
    </div>

    <div class="header">
      <h1 data-i18n="name">Giorgi Jgerenaia, PhD</h1>
      <p data-i18n="subtitle">Choose which card to open and share</p>
    </div>

    <div class="cards">
      <a class="card-link" href="agency.html">
        <div class="logo-box">
          <img src="img/coa.webp" alt="" />
        </div>
        <div class="meta">
          <div class="label" data-i18n="proLabel">Professional</div>
          <div class="title" data-i18n="agencyTitle">Regulation Agency</div>
          <div class="sub" data-i18n="agencySub">Drug Quality Laboratory</div>
        </div>
        <div class="arrow">›</div>
      </a>

      <a class="card-link" href="tsmu.html">
        <div class="logo-box">
          <img src="img/tsmu-logo.webp" alt="" />
        </div>
        <div class="meta">
          <div class="label" data-i18n="acadLabel">Academic</div>
          <div class="title" data-i18n="tsmuTitle">Tbilisi State Medical University</div>
          <div class="sub" data-i18n="tsmuSub">Department of Pharmacognosy</div>
        </div>
        <div class="arrow">›</div>
      </a>
    </div>

    <p class="note" data-i18n-html="note">
      Only you use this page.<br>
      Open a card, then show its QR to others.
    </p>
  </div>

  <script>
    const I18N = {
      en: {
        name: "Giorgi Jgerenaia, PhD",
        subtitle: "Choose which card to open and share",
        proLabel: "Professional",
        agencyTitle: "Regulation Agency",
        agencySub: "Drug Quality Laboratory",
        acadLabel: "Academic",
        tsmuTitle: "Tbilisi State Medical University",
        tsmuSub: "Department of Pharmacognosy",
        note: "Only you use this page.<br>Open a card, then show its QR to others."
      },
      ka: {
        name: "გიორგი ჯგერენაია, PhD",
        subtitle: "აირჩიეთ ბარათი გასახსნელად და გასაზიარებლად",
        proLabel: "პროფესიული",
        agencyTitle: "რეგულირების სააგენტო",
        agencySub: "წამლის ხარისხის ლაბორატორია",
        acadLabel: "აკადემიური",
        tsmuTitle: "თბილისის სახელმწიფო სამედიცინო უნივერსიტეტი",
        tsmuSub: "ფარმაკოგნოზიის დეპარტამენტი",
        note: "ამ გვერდს მხოლოდ თქვენ იყენებთ.<br>გახსენით ბარათი და აჩვენეთ მისი QR სხვას."
      }
    };

    function setLang(lang) {
      const dict = I18N[lang] || I18N.en;
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (dict[key] !== undefined) el.textContent = dict[key];
      });
      document.querySelectorAll("[data-i18n-html]").forEach(el => {
        const key = el.getAttribute("data-i18n-html");
        if (dict[key] !== undefined) el.innerHTML = dict[key];
      });
      document.getElementById("btn-en").classList.toggle("active", lang === "en");
      document.getElementById("btn-ka").classList.toggle("active", lang === "ka");
      try { localStorage.setItem("card-lang", lang); } catch (e) {}
    }

    let savedLang = null;
    try { savedLang = localStorage.getItem("card-lang"); } catch (e) {}
    const urlLang = new URLSearchParams(location.search).get("lang");
    const autoLang = (navigator.language || "en").toLowerCase().startsWith("ka") ? "ka" : "en";
    const pick = [urlLang, savedLang, autoLang].find(v => v === "ka" || v === "en");
    setLang(pick);
  </script>
</body>
</html>
