<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0A2540" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Giorgi Jgerenaia — Choose card</title>
  <style>
    :root {
      --navy: #0A2540;
      --navy-light: #133456;
      --blue: #0E4E8C;
      --accent: #1E90FF;
      --sky: #E8F1FB;
      --white: #FFFFFF;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans Georgian", sans-serif;
      background: linear-gradient(160deg, #071a2e 0%, var(--navy) 45%, var(--blue) 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 18px;
      color: var(--white);
    }
    .wrap {
      width: 100%;
      max-width: 420px;
    }
    .top-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 18px;
    }
    .lang-toggle {
      display: flex;
      background: rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 3px;
      border: 1px solid rgba(255,255,255,0.18);
    }
    .lang-btn {
      border: none;
      background: transparent;
      color: #A8C5E2;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 6px 10px;
      border-radius: 999px;
      cursor: pointer;
    }
    .lang-btn.active {
      background: var(--white);
      color: var(--navy);
    }
    .header {
      text-align: center;
      margin-bottom: 28px;
    }
    .header h1 {
      font-size: 1.35rem;
      font-weight: 750;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .header p {
      font-size: 0.85rem;
      color: #A8C5E2;
      line-height: 1.4;
    }
    .cards {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card-link {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(255,255,255,0.97);
      border-radius: 18px;
      padding: 16px 16px;
      text-decoration: none;
      color: var(--navy);
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
      transition: transform 0.15s ease;
    }
    .card-link:active {
      transform: scale(0.98);
    }
    .logo-box {
      width: 72px;
      height: 72px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid #E2ECF6;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      padding: 6px;
    }
    .logo-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .meta {
      flex: 1;
      min-width: 0;
    }
    .meta .label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #5A7A9A;
      margin-bottom: 3px;
    }
    .meta .title {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 3px;
    }
    .meta .sub {
      font-size: 0.75rem;
      color: var(--blue);
      line-height: 1.3;
    }
    .arrow {
      color: #8CA0B4;
      font-size: 1.4rem;
      flex-shrink: 0;
    }
    .note {
      margin-top: 22px;
      text-align: center;
      font-size: 0.72rem;
      color: #8CA0B4;
      line-height: 1.4;
    }
  </style>
</head>
