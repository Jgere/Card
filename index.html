<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#E8F1FB" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="My Cards" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Giorgi Jgerenaia — Choose card</title>
  <style>
    :root {
      --navy: #0A2540;
      --blue: #0E4E8C;
      --accent: #1E90FF;
      --sky: #E8F1FB;
      --muted: #46617C;
      --line: #D3E2F1;
      --white: #FFFFFF;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans Georgian", sans-serif;
      background: linear-gradient(160deg, #F6FAFE 0%, var(--sky) 55%, #D3E4F5 100%);
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      padding: clamp(24px, 7vh, 64px) 18px 32px; color: var(--navy);
    }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .wrap { width: 100%; max-width: 420px; }
    .top-row { display: flex; justify-content: flex-end; margin-bottom: 18px; }
    .lang-toggle { display: flex; background: var(--white); border-radius: 999px; padding: 3px; border: 1px solid var(--line); }
    .lang-btn {
      border: none; background: transparent; color: var(--muted); font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.04em; padding: 6px 10px; border-radius: 999px; cursor: pointer;
    }
    .lang-btn.active { background: var(--navy); color: var(--white); }
    .header { text-align: center; margin-bottom: 28px; }
    .header h1 { font-size: 1.35rem; font-weight: 750; letter-spacing: -0.02em; margin-bottom: 6px; color: var(--navy); }
    .header p { font-size: 0.85rem; color: var(--muted); line-height: 1.4; }
    .cards { display: flex; flex-direction: column; gap: 14px; }
    .card-link {
      display: flex; align-items: center; gap: 16px; background: var(--white); border: 1px solid var(--line);
      border-radius: 18px; padding: 16px; text-decoration: none; color: var(--navy);
      box-shadow: 0 8px 24px rgba(10, 37, 64, 0.08); transition: transform 0.15s ease;
    }
    .card-link:active { transform: scale(0.98); }
    .logo-box {
      width: 72px; height: 72px; border-radius: 14px; background: #fff; border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; padding: 6px;
    }
    .logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .meta { flex: 1; min-width: 0; }
    .meta .label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 3px; }
    .meta .title { font-size: 0.95rem; font-weight: 700; line-height: 1.25; margin-bottom: 3px; }
    .meta .sub { font-size: 0.75rem; color: var(--blue); line-height: 1.3; }
    .arrow { color: var(--muted); font-size: 1.4rem; flex-shrink: 0; }
    .note { margin-top: 22px; text-align: center; font-size: 0.72rem; color: var(--muted); line-height: 1.4; }

    [hidden] { display: none !important; }
    .lang-toggle { margin-left: auto; }
    .top-row { align-items: center; justify-content: space-between; }
    .install { border: 1px solid var(--line); background: var(--white); color: var(--navy); font-weight: 650; font-size: 0.78rem; padding: 8px 12px; border-radius: 999px; cursor: pointer; }
    .card-link { flex-direction: column; align-items: stretch; gap: 14px; }
    .card-link:active { transform: none; }
    .card-row { display: flex; align-items: center; gap: 16px; }
    .card-actions { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; }
    .abtn { border: 1.5px solid #C5D8EC; background: var(--white); color: var(--navy); border-radius: 12px; padding: 11px 6px; font: inherit; font-weight: 650; font-size: 0.85rem; cursor: pointer; text-decoration: none; text-align: center; }
    .abtn.primary { background: var(--navy); border-color: var(--navy); color: var(--white); }
    .abtn:active { transform: scale(0.97); }
    .qr-full { position: fixed; inset: 0; background: #fff; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; z-index: 50; text-align: center; }
    .qr-full.open { display: flex; }
    .qr-full img { width: min(80vw, 58vh); height: auto; }
    .qr-full .qt { font-size: 1.15rem; font-weight: 750; color: var(--navy); }
    .qr-full .qu { font-size: 0.8rem; color: var(--muted); word-break: break-all; }
    .qr-full .abtn { padding: 12px 34px; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-row">
      <button class="install" id="installBtn" hidden data-i18n="install">Install app</button>
      <div class="lang-toggle">
        <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
        <button class="lang-btn" id="btn-ka" onclick="setLang('ka')">ქარ</button>
      </div>
    </div>

    <div class="header">
      <h1 data-i18n="name">Giorgi Jgerenaia, PhD</h1>
      <p data-i18n="subtitle">Choose which card to open and share</p>
    </div>

    <div class="cards" id="cards">
      <div class="card-link" data-card="agency">
        <div class="card-row">
        <div class="logo-box">
          <img src="img/coa.webp" alt="" />
        </div>
        <div class="meta">
          <div class="label" data-i18n="proLabel">Professional</div>
          <div class="title" data-i18n="agencyTitle">Regulation Agency</div>
          <div class="sub" data-i18n="agencySub">Drug Quality Laboratory</div>
        </div>
        </div>
        <div class="card-actions">
          <button class="abtn primary" onclick="showQr('agency')" data-i18n="showQr">Show QR</button>
          <button class="abtn" onclick="shareCard('agency', this)"><span data-i18n="share">Share</span></button>
          <a class="abtn" href="agency.html" onclick="remember('agency')" data-i18n="open">Open</a>
        </div>
      </div>

      <div class="card-link" data-card="tsmu">
        <div class="card-row">
        <div class="logo-box">
          <img src="img/tsmu-logo.webp" alt="" />
        </div>
        <div class="meta">
          <div class="label" data-i18n="acadLabel">Academic</div>
          <div class="title" data-i18n="tsmuTitle">Tbilisi State Medical University</div>
          <div class="sub" data-i18n="tsmuSub">Department of Pharmacognosy</div>
        </div>
        </div>
        <div class="card-actions">
          <button class="abtn primary" onclick="showQr('tsmu')" data-i18n="showQr">Show QR</button>
          <button class="abtn" onclick="shareCard('tsmu', this)"><span data-i18n="share">Share</span></button>
          <a class="abtn" href="tsmu.html" onclick="remember('tsmu')" data-i18n="open">Open</a>
        </div>
      </div>
    </div>

    <p class="note" data-i18n-html="note">
      Only you use this page.<br>
      Open a card, then show its QR to others.
    </p>
  </div>

  <div class="qr-full" id="qrFull" role="dialog" aria-modal="true" onclick="if(event.target===this)closeQr()">
    <img id="qrImg" src="" alt="QR code" />
    <div class="qt" id="qrTitle"></div>
    <div class="qu" id="qrUrl"></div>
    <button class="abtn" onclick="closeQr()" data-i18n="close">Close</button>
  </div>

  <script>
    const I18N = {
      en: {
        name: "Giorgi Jgerenaia, PhD",
        subtitle: "Choose which card to open and share",
        proLabel: "Professional",
        agencyTitle: "Regulation Agency",
        agencySub: "Drug Quality Laboratory",
        acadLabel: "Academic",
        tsmuTitle: "Tbilisi State Medical University",
        tsmuSub: "Department of Pharmacognosy",
        showQr: "Show QR", share: "Share", open: "Open", close: "Close", copied: "Link copied", install: "Install app",
        note: "Choose a card, then show its QR or share the link."
      },
      ka: {
        name: "გიორგი ჯგერენაია, PhD",
        subtitle: "აირჩიეთ ბარათი გასახსნელად და გასაზიარებლად",
        proLabel: "პროფესიული",
        agencyTitle: "რეგულირების სააგენტო",
        agencySub: "წამლის ხარისხის ლაბორატორია",
        acadLabel: "აკადემიური",
        tsmuTitle: "თბილისის სახელმწიფო სამედიცინო უნივერსიტეტი",
        tsmuSub: "ფარმაკოგნოზიის დეპარტამენტი",
        showQr: "QR-ის ჩვენება", share: "გაზიარება", open: "გახსნა", close: "დახურვა", copied: "ბმული დაკოპირებულია", install: "დაყენება",
        note: "აირჩიეთ ბარათი, აჩვენეთ QR ან გააზიარეთ ბმული."
      }
    };

    function setLang(lang) {
      const dict = I18N[lang] || I18N.en;
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (dict[key] !== undefined) el.textContent = dict[key];
      });
      document.querySelectorAll("[data-i18n-html]").forEach(el => {
        const key = el.getAttribute("data-i18n-html");
        if (dict[key] !== undefined) el.innerHTML = dict[key];
      });
      document.getElementById("btn-en").classList.toggle("active", lang === "en");
      document.getElementById("btn-ka").classList.toggle("active", lang === "ka");
      try { localStorage.setItem("card-lang", lang); } catch (e) {}
    }

    let savedLang = null;
    try { savedLang = localStorage.getItem("card-lang"); } catch (e) {}
    const urlLang = new URLSearchParams(location.search).get("lang");
    const autoLang = (navigator.language || "en").toLowerCase().startsWith("ka") ? "ka" : "en";
    const pick = [urlLang, savedLang, autoLang].find(v => v === "ka" || v === "en");
    setLang(pick);
    function absUrl(p) { return new URL(p, location.href).href; }
    function remember(k) { try { localStorage.setItem("last-card", k); } catch (e) {} }
    let wl = null;
    async function showQr(k) {
      const c = document.querySelector('[data-card="' + k + '"]');
      document.getElementById("qrImg").src = "img/qr-" + k + ".svg";
      document.getElementById("qrTitle").textContent = c.querySelector(".title").textContent;
      document.getElementById("qrUrl").textContent = absUrl(k + ".html").replace(/^https?:\/\//, "");
      document.getElementById("qrFull").classList.add("open");
      remember(k);
      try { wl = await navigator.wakeLock.request("screen"); } catch (e) {}
    }
    function closeQr() {
      document.getElementById("qrFull").classList.remove("open");
      if (wl) { wl.release(); wl = null; }
    }
    async function shareCard(k, btn) {
      const url = absUrl(k + ".html"); remember(k);
      if (navigator.share) { try { await navigator.share({ title: "Giorgi Jgerenaia, PhD", url }); } catch (e) {} return; }
      try {
        await navigator.clipboard.writeText(url);
        const sp = btn.querySelector("span"), old = sp.textContent;
        sp.textContent = I18N[document.documentElement.lang].copied;
        setTimeout(() => { sp.textContent = old; }, 1800);
      } catch (e) {}
    }
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeQr(); });
    try {
      if (localStorage.getItem("last-card") === "tsmu") {
        const box = document.getElementById("cards");
        box.insertBefore(box.querySelector('[data-card="tsmu"]'), box.firstChild);
      }
    } catch (e) {}
    const show = new URLSearchParams(location.search).get("show");
    if (show === "agency" || show === "tsmu") showQr(show);
    let deferred = null;
    window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; document.getElementById("installBtn").hidden = false; });
    document.getElementById("installBtn").onclick = async () => { deferred.prompt(); await deferred.userChoice; document.getElementById("installBtn").hidden = true; };
    if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  </script>
</body>
</html>
